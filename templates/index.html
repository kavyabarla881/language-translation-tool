<!DOCTYPE html>
<html>
<head>
<title>Language Translator</title>
<style>
body{font-family:Arial;background:#f0f2f5;text-align:center;padding:30px}
.container{background:white;max-width:600px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
textarea{width:90%;height:100px;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
select,button{padding:10px 15px;margin:5px;border-radius:8px;border:1px solid #ccc}
button{background:#6c5ce7;color:white;border:none;cursor:pointer;font-weight:bold}
.result{background:#f8f9fa;padding:15px;border-radius:8px;margin-top:15px;min-height:40px}
</style>
</head>
<body>
<div class="container">
<h2>🌐 Language Translator</h2>
<textarea id="text" placeholder="Enter text..."></textarea><br>
<select id="lang">
<option value="te">Telugu</option>
<option value="hi">Hindi</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="en">English</option>
</select>
<button onclick="translateText()">Translate</button>
<div class="result" id="result">Translated text will appear here</div>
</div>
<script>
async function translateText(){
let t=document.getElementById('text').value;
let l=document.getElementById('lang').value;
let r=await fetch('/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,target:l})});
let d=await r.json();
document.getElementById('result').innerText=d.translated;
}
</script>
</body>
</html>
